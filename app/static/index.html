<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClarifySign</title>
<style>
:root{--canvas:#f4f1ea;--surface:#fffdf8;--surface-raised:#fff;--ink:#172527;--muted:#697779;--line:#d9dfd6;--brand:#006b62;--brand-deep:#004c46;--accent:#d87932;--accent-soft:#fff0e3;--ok:#168260;--ok-soft:#e5f5ed;--warn:#a85b12;--warn-soft:#fff3df;--err:#b94342;--err-soft:#fceaea;--shadow:0 12px 32px rgba(25,45,43,.08);--radius:18px;--font:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{--canvas:#101b1c;--surface:#152526;--surface-raised:#1b2e2f;--ink:#edf5ef;--muted:#aabbb5;--line:#2b4140;--brand:#4ec9b4;--brand-deep:#80e0cb;--accent:#ffaf69;--accent-soft:#3b2b1d;--ok:#58d2a2;--ok-soft:#173c32;--warn:#ffc267;--warn-soft:#3c2d18;--err:#ff918d;--err-soft:#402425;--shadow:none}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 4% -10%,#d9efe7 0,transparent 34rem),var(--canvas);color:var(--ink);font:16px/1.5 var(--font)}
header{display:flex;gap:20px;align-items:center;justify-content:space-between;padding:16px clamp(20px,4vw,56px);background:color-mix(in srgb,var(--surface) 92%,transparent);border-bottom:1px solid var(--line);backdrop-filter:blur(14px);position:sticky;top:0;z-index:5}h1{display:flex;align-items:center;gap:10px;font-size:20px;margin:0;letter-spacing:-.04em}h1:before{content:"";width:27px;height:27px;border-radius:9px;background:conic-gradient(from 135deg,var(--accent) 0 25%,var(--brand) 0 65%,#97d8c9 0);box-shadow:inset 0 0 0 4px color-mix(in srgb,#fff 60%,transparent)}h1 span{color:var(--brand)}
.hdr{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.hdr label{display:flex;gap:7px;align-items:center;white-space:nowrap}
select,button,input{font:inherit;color:var(--ink);background:var(--surface-raised);border:1px solid var(--line);border-radius:10px;padding:9px 12px}select:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 25%,transparent);outline-offset:2px}button{cursor:pointer;min-height:40px;transition:transform .16s ease,background .16s ease,border-color .16s ease,box-shadow .16s ease}button:hover:not(:disabled){transform:translateY(-1px);border-color:var(--brand);box-shadow:0 5px 14px rgba(0,80,70,.12)}button.primary{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:750;box-shadow:0 7px 14px rgba(0,107,98,.2)}button.primary:hover:not(:disabled){background:var(--brand-deep)}button:disabled{opacity:.44;cursor:not-allowed;box-shadow:none}
.tabs{display:flex;gap:4px;max-width:1240px;margin:0 auto;padding:22px clamp(20px,4vw,56px) 0}.tab{border:0;border-radius:11px;padding:10px 16px;color:var(--muted);background:transparent;font-weight:700}.tab.on{background:var(--surface-raised);color:var(--brand);box-shadow:0 0 0 1px var(--line),var(--shadow)}
main{display:grid;grid-template-columns:minmax(0,1.06fr) minmax(360px,.94fr);gap:20px;padding:20px clamp(20px,4vw,56px) 36px;max-width:1240px;margin:0 auto}@media(max-width:860px){main{grid-template-columns:1fr}.vs{grid-template-columns:1fr!important}.stage{min-height:560px!important}}@media(max-width:560px){header{align-items:flex-start;flex-direction:column;padding:14px 18px}.hdr{width:100%}.hdr select{flex:1}.tabs{padding:14px 18px 0}main{padding:14px 18px 28px}.pane{min-height:390px!important}.stage{min-height:500px!important}.fab{left:14px;right:auto!important}.caption{bottom:100px!important;font-size:19px!important}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}.video{position:relative;background:linear-gradient(145deg,#213235,#0c1516);border-radius:13px;overflow:hidden;aspect-ratio:4/3;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}.video:after{content:"Camera preview";position:absolute;left:12px;top:10px;padding:4px 8px;border-radius:999px;background:rgba(0,0,0,.45);color:#fff;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.pill{display:inline-flex;gap:8px;align-items:center;padding:7px 11px;border-radius:99px;background:var(--surface-raised);border:1px solid var(--line);font-size:13px;font-weight:750;margin-top:14px}.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}.dot.live{background:var(--ok);animation:p 1.2s infinite}.dot.warn{background:var(--warn)}.dot.err{background:var(--err)}@keyframes p{50%{opacity:.3;transform:scale(.74)}}
.log{display:flex;flex-direction:column;gap:10px;min-height:170px;max-height:340px;overflow:auto;margin-top:12px}.msg{border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:12px;padding:13px 14px;background:var(--surface-raised)}.msg .big{font-size:25px;font-weight:760;line-height:1.2;letter-spacing:-.03em;margin:3px 0}.msg .sub{color:var(--muted);font-size:13px}.ask{border:1px solid color-mix(in srgb,var(--accent) 60%,var(--line));border-radius:14px;padding:15px;margin-top:14px;background:var(--accent-soft);box-shadow:0 8px 22px rgba(195,102,35,.08)}.ask strong{display:block;font-size:16px}.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.opts button{background:var(--surface-raised);font-weight:700}.note{color:var(--muted);font-size:13px;margin-top:9px}.err{color:var(--err)}
canvas{width:100%;max-width:420px;background:var(--canvas);border-radius:12px;border:1px solid var(--line)}details{margin:0 clamp(20px,4vw,56px) 24px;max-width:1240px;margin-inline:auto}details pre{white-space:pre-wrap;font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}

.vs{display:grid;grid-template-columns:minmax(0,.92fr) minmax(420px,1.08fr);gap:0;padding:0;overflow:hidden}.langtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:10px 14px;overflow:auto}.langtabs button{min-height:35px;border:0;border-radius:8px;background:transparent;padding:7px 11px;color:var(--muted);font-size:13px;font-weight:700}.langtabs button.on{color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,transparent)}.pane{position:relative;padding:24px;display:flex;flex-direction:column;min-height:530px}.pane textarea{flex:1;width:100%;border:0;border-radius:0;background:transparent;font-size:clamp(22px,2.4vw,30px);line-height:1.25;resize:none;outline:none;color:var(--ink);padding:0;min-height:265px}.pane textarea::placeholder{color:color-mix(in srgb,var(--muted) 65%,transparent)}.tools{display:flex;gap:9px;align-items:center;padding-top:14px;border-top:1px solid var(--line)}.tools .sp{flex:1}.ic{width:42px;height:42px;border-radius:50%;padding:0;font-size:17px;display:grid;place-items:center}.stage{background:linear-gradient(155deg,#152a29,#0e1b1b);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:530px;overflow:hidden}.stage:before{content:"";position:absolute;width:640px;height:640px;border-radius:50%;background:radial-gradient(circle,rgba(118,220,195,.15),transparent 65%);top:-170px;right:-220px}.stage canvas{position:relative;border:0;background:transparent;width:100%;max-width:520px;height:auto}.caption{position:absolute;left:20px;right:20px;bottom:96px;text-align:center;color:#fff;font-size:23px;font-weight:750;text-shadow:0 2px 10px #000;pointer-events:none}.gloss-strip{position:absolute;left:14px;right:14px;bottom:56px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;z-index:2}.gloss-pill{background:rgba(8,24,23,.84);color:#c7d8d3;border:1px solid rgba(199,216,211,.25);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s}.gloss-pill.active{background:var(--accent);color:#1f2422;border-color:#ffd3b2;box-shadow:0 0 0 3px rgba(216,121,50,.2);transform:scale(1.04)}.gloss-pill.passed{opacity:.52}.gloss-pill.nosign{border-color:#ffb36f;color:#ffcb9c}.gloss-pill.nosign.active{background:#f09b4b;color:#1f2422;border-color:#ffd6ad}.fab{position:absolute;right:14px;bottom:11px;display:flex;gap:8px;align-items:center;z-index:3}.fab button{width:40px;height:40px;border-radius:50%;background:var(--surface-raised);border:0;color:var(--ink);font-size:18px;padding:0}.spd-sel{background:rgba(8,24,23,.78);color:#fff;border:1px solid rgba(255,255,255,.22);border-radius:8px;padding:7px;font-size:12px;cursor:pointer}.asr-badge{background:var(--ok-soft);border:1px solid color-mix(in srgb,var(--ok) 35%,var(--line));border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink);margin-top:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.asr-badge .conf{background:var(--ok);color:#fff;border-radius:999px;padding:3px 7px;font-weight:800;font-size:11px}.asr-badge .hint{color:var(--muted);font-size:12px}.stage .pill{position:absolute;left:14px;top:8px;z-index:3;background:rgba(8,24,23,.7);color:#e8f4ef;border-color:rgba(255,255,255,.17)}.nosign-note{position:absolute;bottom:33px;font-size:12px;color:#ffce9d;padding:4px 14px;text-align:center;z-index:3}.hud{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:13px 0 0;margin-top:12px;border-top:1px solid var(--line)}.hud-chip{font-size:12px;font-weight:750;padding:4px 8px;border-radius:999px;border:1px solid var(--line);background:var(--canvas)}.hud-chip.ok{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}.hud-chip.no{background:var(--err-soft);color:var(--err);border-color:color-mix(in srgb,var(--err) 35%,var(--line))}.hud-chip.live{background:color-mix(in srgb,var(--brand) 12%,var(--surface));color:var(--brand);border-color:color-mix(in srgb,var(--brand) 35%,var(--line))}.hud-chip.prov{background:var(--ok-soft);color:var(--ok);border-radius:8px;font-size:11px}.pose-hint{font-size:13px;color:var(--warn);margin-top:9px;display:none}.hide{display:none}
.hide{display:none}
</style>
</head>
<body>
<header>
  <h1>Clarify<span>Sign</span></h1>
  <div class="hdr">
    <select id="lang" aria-label="Language"></select>
    <label class="note" style="margin:0"><input type="checkbox" id="auto" checked> Speak aloud</label>
    <label class="note" style="margin:0"><input type="checkbox" id="rs"> Research</label>
  </div>
</header>
<div class="tabs"><button class="tab on" id="t1">Sign → Voice</button><button class="tab" id="t2">Voice → Sign</button></div>

<main id="m1">
  <section class="card">
    <div class="video"><video id="cam" autoplay playsinline muted></video></div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span class="pill"><span class="dot" id="dot"></span><span id="status">Ready</span></span>
      <button class="primary" id="go" style="margin-top:12px">Start camera</button>
      <button id="reset" style="margin-top:12px" disabled>Reset</button>
    </div>
    <div class="note" id="banner" role="status" aria-live="polite"></div>
    <!-- Always-visible HUD driven by diag events -->
    <div class="hud" id="hud">
      <span class="hud-chip" id="hud-pose">Pose –</span>
      <span class="hud-chip" id="hud-lh">LH –</span>
      <span class="hud-chip" id="hud-rh">RH –</span>
      <span class="hud-chip live" id="hud-state">watching</span>
      <span class="hud-chip" id="hud-fps">– fps</span>
      <span class="hud-chip" id="hud-wrist">wrist –</span>
      <span class="hud-chip" id="hud-prov" style="display:none"></span>
    </div>
    <div class="pose-hint" id="pose-hint">Sit back so your head, shoulders and both hands are in view, with good light.</div>
  </section>
  <section class="card">
    <strong>Conversation</strong>
    <div class="log" id="log" aria-live="polite"><div class="note">Sign in front of the camera. Raise your hands, sign, then lower them.</div></div>
    <div id="askbox" aria-live="assertive"></div>
    <div class="note" id="voicenote"></div>
  </section>
</main>

<main id="m2" class="hide" style="grid-template-columns:1fr">
  <section class="card vs">
    <div>
      <div class="langtabs" id="ltabs"></div>
      <div class="pane">
        <textarea id="txt" maxlength="200" placeholder="Type or speak a phrase"></textarea>
        <div class="note" id="matched"></div>
        <div class="tools">
          <button class="ic" id="mic" title="Speak" aria-label="Speak" aria-pressed="false">🎤</button>
          <button class="ic" id="say" title="Hear it in the selected language">🔊</button>
          <span class="sp"></span><span class="note" id="cnt">0 / 200</span>
          <button class="primary" id="send">Show sign</button>
        </div>
        <div class="asr-badge" id="asr-badge" style="display:none"></div>
        <div class="note" id="scope"></div>
      </div>
    </div>
    <div class="stage">
      <span class="pill"><span class="dot" id="dot2"></span><span id="status2">Ready</span></span>
      <canvas id="cv" width="520" height="620"></canvas>
      <div class="caption" id="caption"></div>
      <div class="gloss-strip" id="gloss-strip"></div>
      <div class="nosign-note" id="nosign-note" style="display:none"></div>
      <div class="fab">
        <select class="spd-sel" id="spd" title="Animation speed">
          <option value="0.5">0.5×</option>
          <option value="0.75">0.75×</option>
          <option value="1.0" selected>1.0×</option>
          <option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option>
          <option value="2.0">2.0×</option>
        </select>
        <button id="pause" title="Pause / Resume" disabled>⏸</button>
        <button id="replay" title="Replay" disabled>↻</button>
        <button id="dl" title="Download video" disabled>⬇</button>
        <button id="link" title="Copy link" disabled>🔗</button>
      </div>
    </div>
  </section>
</main>

<details id="rsbox" class="hide"><summary>Research / diagnostics</summary><pre id="rsout">–</pre></details>

<script src="/static/renderer.js"></script>
<script src="/static/speech.js"></script>
<script>
const $=id=>document.getElementById(id);
const STATUS={idle:"Ready",listening:"Watching for a sign",signing:"Recognizing…",interpreting:"Working out the meaning…",clarifying:"I need to check something",resolved:"Got it",speaking:"Speaking…",voice:"Listening to you…",generating:"Preparing the sign…",error:"Something went wrong"};
let CFG=null,ws=null,stream=null,timer=null,watchdogTimer=null,inflight=false,lang=localStorage.getItem("lang")||"en";
let animationReady=false;
let _poseOkSince=null,_poseHintTimer=null,_warnShown=false;
const SID=(()=>{let s=sessionStorage.getItem("sid");if(!s){s=crypto.randomUUID();sessionStorage.setItem("sid",s);}return s;})();

function setStatus(k,tone){const t=STATUS[k]||k;$("status").textContent=t;$("status2").textContent=t;
  for(const d of [$("dot"),$("dot2")]){d.className="dot "+(tone||(["listening","signing"].includes(k)?"live":k==="error"?"err":k==="clarifying"?"warn":""));}}
function say(el,text,cls){el.textContent=text;el.className=cls||"note"}

// ---------- config ----------
fetch("/api/config").then(r=>r.json()).then(c=>{CFG=c;
  const s=$("lang");c.languages.forEach(l=>{const o=document.createElement("option");o.value=l.code;o.textContent=l.name;s.appendChild(o)});
  s.value=c.languages.some(l=>l.code===lang)?lang:(c.languages[0]?.code||"en");lang=s.value;
  if(!c.recognition_ready){
    $("go").disabled=true;
    say($("banner"),c.reason,"note err");
  }
  const r=c.recognition||{};
  $("scope").textContent=`This research prototype has ${r.class_count||0} recorded isolated signs. It does not translate arbitrary sentences.`;
  const audit=r.demo_audit;
  if(audit && !audit.passing){
    $("scope").textContent+=` Model quality gate not met (${Math.round((audit.top1||0)*100)}% agreement with its recorded demonstrations); use camera results as experimental only.`;
  }
  if(!c.signs_available)$("scope").textContent+=" Sign animations are not installed yet.";
  loadSigns();checkVoice();initFromUrl();});
$("lang").onchange=()=>{lang=$("lang").value;localStorage.setItem("lang",lang);checkVoice();if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:"config",lang}))};
$("rs").onchange=()=>$("rsbox").classList.toggle("hide",!$("rs").checked);
$("t1").onclick=()=>tab(1);$("t2").onclick=()=>tab(2);
function tab(n){$("m1").classList.toggle("hide",n!==1);$("m2").classList.toggle("hide",n!==2);$("t1").classList.toggle("on",n===1);$("t2").classList.toggle("on",n===2)}

// Speech provider instances (browser-native Web Speech API only)
const asrProvider = new window.WebSpeechASRProvider();
const ttsProvider = new window.WebSpeechTTSProvider();
let lastAsrText = "", lastAsrConfidence = 1.0;

function checkVoice(){
  if(!CFG)return;
  const l=CFG.languages.find(x=>x.code===lang);
  const vs = ttsProvider.getVoices(l ? l.tag : navigator.language);
  $("voicenote").textContent=vs.length?"":`No native ${l ? l.name : lang} voice on this device. Fallback synthesis will be used.`;
}
if("speechSynthesis" in window) speechSynthesis.onvoiceschanged=checkVoice;

function speak(text,tag){
  setStatus("speaking","live");
  return ttsProvider.speak(text, {
    lang: tag || (CFG?.languages.find(x=>x.code===lang)?.tag || navigator.language),
    cancelPrevious: true,
    onEnd: ()=>{ setStatus("idle"); },
    onError: ()=>{ setStatus("idle"); }
  });
}

// ---------- Sign -> Voice ----------
function addMsg(html){const d=document.createElement("div");d.className="msg";d.innerHTML=html;const L=$("log");
  if(L.querySelector(".note"))L.innerHTML="";L.appendChild(d);L.scrollTop=L.scrollHeight;return d}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

async function start(){
  if(CFG&&!CFG.recognition_ready){setStatus("error");return}
  inflight=false;
  if(watchdogTimer){clearTimeout(watchdogTimer);watchdogTimer=null;}
  try{stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720}},audio:false})}
  catch(e){setStatus("error");say($("banner"),"Camera permission was denied.","note err");return}
  $("cam").srcObject=stream;
  say($("banner"),"","note");
  ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws/sign?sid="+encodeURIComponent(SID));
  ws.binaryType="arraybuffer";
  ws.onopen=()=>{ws.send(JSON.stringify({type:"config",lang}));$("go").textContent="Stop";$("reset").disabled=false;pump()};
  ws.onmessage=ev=>onEvent(JSON.parse(ev.data));
  ws.onerror=()=>{setStatus("error");say($("banner"),"WebSocket connection error.","note err")};
  ws.onclose=ev=>{
    const wasActive=!!stream;
    stop(false,false);
    if(wasActive){
      setStatus("error");
      say($("banner"),"Connection to server lost. Click 'Start camera' to reconnect.","note err");
    }
  };
}
function stop(closeWs=true,userInitiated=true){
  clearTimeout(timer);
  if(watchdogTimer){clearTimeout(watchdogTimer);watchdogTimer=null;}
  inflight=false;
  if(closeWs&&ws){ws.onclose=null;ws.close()}
  ws=null;
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=null;$("cam").srcObject=null;
  $("go").textContent="Start camera";$("reset").disabled=true;$("askbox").innerHTML="";
  if(userInitiated){setStatus("idle");say($("banner"),"","note")}
}
$("go").onclick=()=>stream?stop(true,true):start();
$("reset").onclick=()=>{$("askbox").innerHTML="";if(ws)ws.send(JSON.stringify({type:"reset"}))};

const cap=document.createElement("canvas");
function pump(){ // one frame in flight at a time; the camera frame is sent UNMIRRORED
  if(!ws||ws.readyState!==1)return;
  const v=$("cam");
  if(!inflight&&v.videoWidth){
    cap.width=480;cap.height=Math.round(480*v.videoHeight/v.videoWidth);
    cap.getContext("2d").drawImage(v,0,0,cap.width,cap.height);
    inflight=true;
    if(watchdogTimer)clearTimeout(watchdogTimer);
    watchdogTimer=setTimeout(()=>{
      if(inflight){console.warn("Watchdog: ack not received within 2s, clearing inflight");inflight=false}
    },2000);
    cap.toBlob(b=>{
      if(!b){inflight=false;return}
      b.arrayBuffer().then(buf=>{
        if(ws&&ws.readyState===1)ws.send(buf);
        else inflight=false;
      }).catch(()=>{inflight=false;});
    },"image/jpeg",0.7);
  }
  timer=setTimeout(pump,40);
}
function ask(q){setStatus("clarifying","warn");const box=$("askbox");box.innerHTML="";
  const d=document.createElement("div");d.className="ask";d.innerHTML=`<strong>${esc(q.text)}</strong><div class="opts"></div>`;
  q.options.forEach(o=>{const b=document.createElement("button");b.textContent=o.text_lang?`${o.label} · ${o.text_lang}`:o.label;
    b.onclick=()=>{box.innerHTML="";ws.send(JSON.stringify({type:"answer",value:o.value}));setStatus("interpreting")};d.querySelector(".opts").appendChild(b)});
  box.appendChild(d)}
function updateHud(d){
  const chip=(id,ok,label)=>{const el=$(id);if(!el)return;el.textContent=label;el.className='hud-chip '+(ok?'ok':'no');}
  chip('hud-pose',d.pose,'Pose '+(d.pose?'✓':'✗'));
  chip('hud-lh',d.lh,'LH '+(d.lh?'✓':'✗'));
  chip('hud-rh',d.rh,'RH '+(d.rh?'✓':'✗'));
  const st=$("hud-state");if(st){st.textContent=d.state||'watching';st.className='hud-chip live';}
  const fp=$("hud-fps");if(fp)fp.textContent=(d.fps||0)+' fps';
  const wr=$("hud-wrist");if(wr){
    if(d.wrist_y!=null)wr.textContent='wrist '+d.wrist_y.toFixed(2)+(d.act_y?' / '+d.act_y:'');
    else wr.textContent='wrist –';
  }
  // Pose-missing hint
  const hint=$("pose-hint");
  if(hint){if(!d.pose){if(!_poseHintTimer)_poseHintTimer=setTimeout(()=>{hint.style.display='';_poseHintTimer=null},2000);}else{if(_poseHintTimer){clearTimeout(_poseHintTimer);_poseHintTimer=null}hint.style.display='none';}}
}
async function onEvent(e){
  if(e.research||e.top){$("rsout").textContent=JSON.stringify(e.research||{top:e.top},null,2)}
  if(e.type==="ack"){inflight=false;if(watchdogTimer){clearTimeout(watchdogTimer);watchdogTimer=null}return}
  if(e.type==="diag"){if(e.research)updateHud(e.research);return}
  else if(e.type==="state"){setStatus(e.state)}
  else if(e.type==="provisional"){
    if(e.top&&e.top.length>0){
      const top1=e.top[0];
      setStatus("Recognizing… "+top1.label+" ("+Math.round(top1.p*100)+"%)","live");
      // Show provisional top-3 as chips in HUD
      const prov=$("hud-prov");
      if(prov){prov.style.display='';prov.textContent=e.top.slice(0,3).map(t=>t.label+' '+Math.round(t.p*100)+'%').join(' | ');}
    }
  }
  else if(e.type==="clarify"){ask(e.question)}
  else if(e.type==="resolved"){$("askbox").innerHTML="";setStatus("resolved","live");
    addMsg(`<div class="sub">You signed</div><div class="big">${esc(e.text)}</div><div class="sub">${esc(e.english)}${e.how==="best_guess"?" · best guess":""}</div>`);
    const prov=$("hud-prov");if(prov)prov.style.display='none';
    if($("auto").checked)await speak(e.text,e.tag);setStatus("listening")}
  else if(e.type==="resign"){$("askbox").innerHTML="";
    addMsg(`<div class="sub">${esc(e.message||"Sign not recognised. Please try again.")}</div>`);
    setStatus("listening")}
  else if(e.type==="warn"){if(!_warnShown){_warnShown=true;say($("banner"),e.message,"note");setTimeout(()=>{_warnShown=false;say($("banner"),"","note")},5000);}return}
  else if(e.type==="error"){setStatus("error");say($("banner"),e.message,"note err");stop(false,false)}
}

// ---------- Voice -> Sign ----------
let SIGNS=null,avatarRenderer=null,lastIds=[],lastInfo=[];

function initRenderer(){
  if(!avatarRenderer && window.AvatarRenderer){
    avatarRenderer = new window.AvatarRenderer($("cv"), {
      signs: SIGNS,
      glossStripEl: $("gloss-strip"),
      captionEl: $("caption"),
      speed: parseFloat($("spd") ? $("spd").value : 1.0),
      onComplete: ()=>{
        setStatus("idle");
        if($("pause")){$("pause").disabled=true;$("pause").textContent="⏸";}
      }
    });
  } else if(avatarRenderer && SIGNS){
    avatarRenderer.setSigns(SIGNS);
  }
}

function loadSigns(){
  $("send").disabled=true;
  fetch("/api/signs").then(r=>r.ok?r.json():null).then(j=>{
    if(!j || !Object.keys(j).length)throw new Error("The recorded sign library is unavailable.");
    SIGNS=j;
    initRenderer();
    animationReady=true;
    $("send").disabled=false;
  }).catch(()=>{say($("scope"),"Recorded sign animations could not be loaded. Refresh and try again.","note err");});
}

function drawFrame(f){
  initRenderer();
  if(avatarRenderer)avatarRenderer.renderFrame(f);
}

function play(ids,onFrame,done){
  initRenderer();
  if(!avatarRenderer){
    say($("scope"),"Sign animations are not installed yet (models/signs.json missing).","note err");
    return;
  }
  lastIds=ids;
  ["pause","replay","dl","link"].forEach(k=>{if($(k))$(k).disabled=false;});
  if($("pause"))$("pause").textContent="⏸";
  setStatus("generating","live");

  avatarRenderer.play(ids,{
    speed: parseFloat($("spd") ? $("spd").value : 1.0),
    onFrame: (idx,meta)=>{
      if(onFrame)onFrame(idx,meta);
    },
    onComplete: ()=>{
      setStatus("idle");
      if($("pause")){$("pause").disabled=true;$("pause").textContent="⏸";}
      if(done)done();
    }
  });
}

$("pause").onclick=()=>{
  if(!avatarRenderer)return;
  if(avatarRenderer.isPaused){
    avatarRenderer.resume();
    $("pause").textContent="⏸";
  } else {
    avatarRenderer.pause();
    $("pause").textContent="▶";
  }
};
$("spd").onchange=e=>{
  if(avatarRenderer)avatarRenderer.setSpeed(parseFloat(e.target.value));
};
$("replay").onclick=()=>play(lastIds);
$("dl").onclick=()=>{const c=$("cv");if(!window.MediaRecorder||!c.captureStream){say($("scope"),"Video download needs Chrome or Edge.","note err");return}
  const chunks=[],rec=new MediaRecorder(c.captureStream(25),{mimeType:"video/webm"});rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(chunks,{type:"video/webm"}));a.download="clarifysign.webm";a.click()};
  rec.start();play(lastIds,null,()=>setTimeout(()=>rec.stop(),200))};
$("link").onclick=()=>{const u=`${location.origin}/?tab=voice&lang=${lang}&text=${encodeURIComponent($("txt").value)}`;
  (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>say($("scope"),"Link copied. It works on this computer while the app is running.","note")).catch(()=>say($("scope"),u,"note"))};
async function understand(text){
  if(!animationReady){say($("scope"),"The sign library is still loading. Please wait a moment.","note err");return;}
  const submit=$("send"), originalLabel=submit.textContent;
  submit.disabled=true;submit.textContent="Preparing…";
  $("txt").value=text;
  $("cnt").textContent=text.length+" / 200";
  try{
    const r=await fetch(`/api/understand?text=${encodeURIComponent(text)}&lang=${lang}&sid=${encodeURIComponent(SID)}`);
    if(!r.ok)throw new Error("The sign translation service is unavailable.");
    const j=await r.json();
  const rsout=$("rsout");
  if(rsout){
    let prev=rsout.textContent;if(prev==="–")prev="";
    rsout.textContent=`Heard: "${j.heard}"  plan: ${(j.plan||[]).map(p=>p.gloss||p.concept).join(" → ")||"NONE"}\n`+prev;
  }
  const plan=j.plan||[];
    if(!plan.length){
      $("matched").textContent="No supported sign found in that phrase.";
      setStatus("idle");return;
    }
    lastInfo=plan;
    $("matched").textContent=(j.text||plan.map(p=>p.gloss).join(" "));
    const coverage=j.coverage||{};
    if(!coverage.complete){
      const missing=[...(coverage.unmapped_tokens||[]),...(coverage.unrecorded_concepts||[])];
      say($("scope"),`Showing only the recorded portion. Not represented: ${missing.join(", ")||"some sentence content"}.`,"note err");
    }
    play(plan);
  }catch(err){
    setStatus("error");
    say($("scope"),err.message||"Unable to prepare signs right now.","note err");
  }finally{
    submit.disabled=false;submit.textContent=originalLabel;
  }
}

$("send").onclick=()=>understand($("txt").value);
$("txt").oninput=()=>{$("cnt").textContent=$("txt").value.length+" / 200"};
$("say").onclick=async()=>{
  const l=CFG.languages.find(x=>x.code===lang);
  const speakText = lastInfo.length ? lastInfo.map(c=>c.text).join(" ") : $("txt").value;
  if(!speakText) return;
  await speak(speakText, l ? l.tag : navigator.language);
  setStatus("idle");
};

function langTabs(){const t=$("ltabs");t.innerHTML="";CFG.languages.forEach(l=>{const b=document.createElement("button");b.textContent=l.name;b.className=l.code===lang?"on":"";
  b.onclick=()=>{$("lang").value=l.code;$("lang").onchange();langTabs()};t.appendChild(b)})}

let isMicActive = false;
$("mic").onclick=()=>{
  if(isMicActive){
    asrProvider.stop();
    isMicActive = false;
    $("mic").setAttribute("aria-pressed","false");
    setStatus("idle");
    return;
  }

  if(!asrProvider.isSupported()){
    setStatus("error");
    say($("scope"),"Speech recognition is not supported in this browser. Please use Chrome or Edge, or type directly in the box.","note err");
    return;
  }

  const activeProvider = asrProvider;
  setStatus("voice","live");
  say($("scope"),"Listening... speak clearly...","note");
  isMicActive = true;
  $("mic").setAttribute("aria-pressed","true");

  activeProvider.start({
    lang: CFG?.languages.find(x=>x.code===lang)?.tag || navigator.language,
    onStart: ()=>{
      isMicActive = true;
      $("mic").setAttribute("aria-pressed","true");
      setStatus("voice","live");
    },
    onResult: (res)=>{
      $("txt").value = res.transcript;
      $("cnt").textContent = res.transcript.length + " / 200";
      lastAsrText = res.transcript;
      lastAsrConfidence = res.confidence;

      const badge = $("asr-badge");
      if(badge){
        const confPct = Math.round(res.confidence * 100);
        badge.style.display = "flex";
        badge.innerHTML = `<span>Heard: <strong>"${esc(res.transcript)}"</strong></span> <span class="conf">${confPct}% conf</span> <span class="hint">Edit text above if needed, then click 'Show sign'</span>`;
      }
    },
    onError: (err)=>{
      isMicActive = false;
      $("mic").setAttribute("aria-pressed","false");
      setStatus("error");
      say($("scope"), err.message || "Speech recognition error", "note err");
    },
    onEnd: ()=>{
      isMicActive = false;
      $("mic").setAttribute("aria-pressed","false");
      setStatus("idle");
    }
  });
};
function initFromUrl(){langTabs();const p=new URLSearchParams(location.search);
  if(p.get("lang")&&CFG.languages.some(l=>l.code===p.get("lang"))){$("lang").value=p.get("lang");$("lang").onchange();langTabs()}
  if(p.get("tab")==="voice"){tab(2);if(p.get("text"))setTimeout(()=>understand(p.get("text")),600)}}
</script>
