version: 3.0.0
description: 'ClarifySign Domain Ontology for Indian Retail & Shopkeeper Dialogue.
  Translations are machine-authored drafts: have a native speaker review.'
languages:
- code: en
  name: English
  speech_tag: en-IN
- code: hi
  name: Hindi
  speech_tag: hi-IN
- code: ta
  name: Tamil
  speech_tag: ta-IN
- code: hinglish
  name: Hinglish
  speech_tag: hi-IN
  nlu_input_only: true
intent_cues:
  GREET:
    tokens:
    - hello
    - hi
    - hey
    - namaste
    - namaskar
    - pranam
    - vanakkam
    phrases:
    - good morning
    - good afternoon
    - good evening
    - shubh prabhat
    hi_tokens:
    - नमस्ते
    - नमस्कार
    - प्रणाम
    ta_tokens:
    - வணக்கம்
  CONFIRM:
    tokens:
    - haan
    - ha
    - 'yes'
    - theek
    - sahi
    - ok
    - okay
    - sure
    - correct
    - aam
    - sari
    - fine
    hi_tokens:
    - हाँ
    - ठीक
    - सही
    ta_tokens:
    - ஆம்
    - சரி
    max_tokens: 3
  REJECT:
    tokens:
    - nahi
    - 'no'
    - cancel
    - never
    - vendaam
    - mat
    - nahin
    - na
    hi_tokens:
    - नहीं
    - मत
    - ना
    ta_tokens:
    - இல்லை
    - வேண்டாம்
    max_tokens: 3
    requires_negation: true
  PAYMENT:
    tokens:
    - upi
    - qr
    - scanner
    - scan
    - cash
    - gpay
    - phonepe
    - paytm
    - paise
    - payment
    - chhutte
    - khulle
    - change
    - bill
    - pay
    phrases:
    - செலுத்த
    - பணம் செலுத்த
    hi_tokens:
    - पैसे
    - भुगतान
    ta_tokens:
    - பணம்
  QUESTION:
    tokens:
    - kitna
    - kitne
    - price
    - cost
    - daam
    - kimat
    - rate
    phrases:
    - how much
    - evvalavu
    hi_tokens:
    - कितना
    - कितने
    - दाम
    - कीमत
    ta_tokens:
    - விலை
    - எவ்வளவு
    bigrams:
    - - how
      - much
  AVAILABILITY:
    tokens:
    - milega
    phrases:
    - milega kya
    - hai kya
    - irukka
    - ek bottle water milega
    - paani milega
    hi_tokens:
    - उपलब्ध
    ta_tokens:
    - இருக்கிறதா
  DIRECTION:
    tokens:
    - kahan
    - kidhar
    - where
    - rasta
    - counter
    - exit
    - engu
    - engae
    hi_tokens:
    - कहाँ
    - किधर
    ta_tokens:
    - எங்கே
    - எங்கு
  REQUEST:
    phrases:
    - chahiye
    - dena
    - dedo
    - de do
    - dijiye
    - pack
    - want
    - give
    - buy
    - kodu
    - thanga
    - need
    - please
    - show
    - dikhao
    - dikha
    hi_tokens:
    - चाहिए
    - दीजिए
    - दो
    ta_tokens:
    - கொடுங்கள்
    - கொடு
    - வேண்டும்
  QUESTION_WORDS:
    tokens:
    - kya
    - what
    - which
    - kaunsa
    - enna
templates:
  en:
    GREET: Hello! How can I help you?
    CONFIRM: Yes, certainly.
    REJECT: No, not available.
    PRICE_Q: How much is this {product}?
    AVAIL_Q: Is {product} available?
    REQUEST: Please give {quantity} {container} {product}.
    PAYMENT: I want to pay using {method}.
    DEFAULT: '{product}'
  hi:
    GREET: नमस्ते! मैं आपकी क्या मदद कर सकता हूँ?
    CONFIRM: हाँ, बिल्कुल।
    REJECT: नहीं, उपलब्ध नहीं है।
    PRICE_Q: इस {product} का दाम कितना है?
    AVAIL_Q: क्या {product} मिलेगा?
    REQUEST: कृपया {quantity} {container} {product} दीजिए।
    PAYMENT: '{method} से भुगतान करना है।'
    DEFAULT: '{product}'
  ta:
    GREET: வணக்கம்! உங்களுக்கு என்ன வேண்டும்?
    CONFIRM: ஆம், நிச்சயமாக.
    REJECT: இல்லை, கிடைக்காது.
    PRICE_Q: இந்த {product} விலை என்ன?
    AVAIL_Q: '{product} இருக்கிறதா?'
    REQUEST: தயவுசெய்து {quantity} {container} {product} கொடுங்கள்.
    PAYMENT: '{method} மூலம் பணம் செலுத்த வேண்டும்.'
    DEFAULT: '{product}'
customer_templates:
  en:
    GREET: Hello.
    CONFIRM: Yes.
    REJECT: No.
    PRICE_Q: How much is this {product}?
    AVAIL_Q: Do you have {product}?
    REQUEST: I want {quantity} {container} {product}.
    PAYMENT: I want to pay by {method}.
    DEFAULT: '{product}'
  hi:
    GREET: नमस्ते।
    CONFIRM: हाँ।
    REJECT: नहीं।
    PRICE_Q: इस {product} का दाम क्या है?
    AVAIL_Q: क्या आपके पास {product} है?
    REQUEST: मुझे {quantity} {container} {product} चाहिए।
    PAYMENT: मैं {method} से भुगतान करना चाहता हूँ।
    DEFAULT: '{product}'
  ta:
    GREET: வணக்கம்.
    CONFIRM: ஆம்.
    REJECT: இல்லை.
    PRICE_Q: இந்த {product} விலை என்ன?
    AVAIL_Q: உங்களிடம் {product} இருக்கிறதா?
    REQUEST: எனக்கு {quantity} {container} {product} வேண்டும்.
    PAYMENT: '{method} மூலம் பணம் செலுத்த விரும்புகிறேன்.'
    DEFAULT: '{product}'
