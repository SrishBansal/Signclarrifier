intent_cues:
  GREET:
    tokens:
    - hello
    - hi
    - hey
    - namaste
    - namaskar
    - pranam
    - vanakkam
    phrases:
    - good morning
    - good afternoon
    - good evening
    - shubh prabhat
    hi_tokens:
    - नमस्ते
    - नमस्कार
    - प्रणाम
    ta_tokens:
    - வணக்கம்
    bn_tokens: [নমস্কার, হ্যালো, প্রণাম]
    te_tokens: [నమస్కారం, హలో, నమస్తే]
  CONFIRM:
    tokens:
    - haan
    - ha
    - 'yes'
    - theek
    - sahi
    - ok
    - okay
    - sure
    - correct
    - aam
    - sari
    - fine
    hi_tokens:
    - हाँ
    - ठीक
    - सही
    ta_tokens:
    - ஆம்
    - சரி
    bn_tokens: [হ্যাঁ, ঠিক, সঠিক]
    te_tokens: [అవును, సరే, నిజం]
    max_tokens: 3
  REJECT:
    tokens:
    - nahi
    - 'no'
    - cancel
    - never
    - vendaam
    - mat
    - nahin
    - na
    hi_tokens:
    - नहीं
    - मत
    - ना
    ta_tokens:
    - இல்லை
    - வேண்டாம்
    bn_tokens: [না, নয়, বাতিল]
    te_tokens: [కాదు, వద్దు, రద్దు]
    max_tokens: 3
    requires_negation: true
  PAYMENT:
    tokens:
    - upi
    - qr
    - scanner
    - scan
    - cash
    - gpay
    - phonepe
    - paytm
    - paise
    - payment
    - chhutte
    - khulle
    - change
    - bill
    - pay
    phrases:
    - செலுத்த
    - பணம் செலுத்த
    hi_tokens:
    - पैसे
    - भुगतान
    ta_tokens:
    - பணம்
    bn_tokens: [টাকা, পেমেন্ট, বিল, নগদ]
    te_tokens: [డబ్బు, చెల్లింపు, బిల్లు, నగదు]
  QUESTION:
    tokens:
    - kitna
    - kitne
    - price
    - cost
    - daam
    - kimat
    - rate
    phrases:
    - how much
    - evvalavu
    hi_tokens:
    - कितना
    - कितने
    - दाम
    - कीमत
    ta_tokens:
    - விலை
    - எவ்வளவு
    bn_tokens: [দাম, কত, মূল্য]
    te_tokens: [ధర, ఎంత, విలువ]
    bigrams:
