    - kya
    - what
    - which
    - kaunsa
    - enna
templates:
  en:
    GREET: Hello! How can I help you?
    CONFIRM: Yes, certainly.
    REJECT: No, not available.
    PRICE_Q: How much is this {product}?
    AVAIL_Q: Is {product} available?
    REQUEST: Please give {quantity} {container} {product}.
    PAYMENT: I want to pay using {method}.
    DEFAULT: '{product}'
  hi:
    GREET: नमस्ते! मैं आपकी क्या मदद कर सकता हूँ?
    CONFIRM: हाँ, बिल्कुल।
    REJECT: नहीं, उपलब्ध नहीं है।
    PRICE_Q: इस {product} का दाम कितना है?
    AVAIL_Q: क्या {product} मिलेगा?
    REQUEST: कृपया {quantity} {container} {product} दीजिए।
    PAYMENT: '{method} से भुगतान करना है।'
    DEFAULT: '{product}'
  ta:
    GREET: வணக்கம்! உங்களுக்கு என்ன வேண்டும்?
    CONFIRM: ஆம், நிச்சயமாக.
    REJECT: இல்லை, கிடைக்காது.
    PRICE_Q: இந்த {product} விலை என்ன?
    AVAIL_Q: '{product} இருக்கிறதா?'
    REQUEST: தயவுசெய்து {quantity} {container} {product} கொடுங்கள்.
    PAYMENT: '{method} மூலம் பணம் செலுத்த வேண்டும்.'
    DEFAULT: '{product}'
  bn:
    GREET: নমস্কার! আমি কীভাবে সাহায্য করতে পারি?
    CONFIRM: হ্যাঁ, অবশ্যই।
    REJECT: না, পাওয়া যাচ্ছে না।
    PRICE_Q: এই {product} কত দাম?
    AVAIL_Q: '{product} কি পাওয়া যাবে?'
    REQUEST: অনুগ্রহ করে {quantity} {container} {product} দিন।
    PAYMENT: '{method} দিয়ে পেমেন্ট করতে চাই।'
    DEFAULT: '{product}'
  te:
    GREET: నమస్కారం! నేను ఎలా సహాయం చేయగలను?
    CONFIRM: అవును, తప్పకుండా.
    REJECT: లేదు, అందుబాటులో లేదు.
    PRICE_Q: ఈ {product} ధర ఎంత?
    AVAIL_Q: '{product} అందుబాటులో ఉందా?'
    REQUEST: దయచేసి {quantity} {container} {product} ఇవ్వండి.
    PAYMENT: '{method} ద్వారా చెల్లించాలనుకుంటున్నాను.'
    DEFAULT: '{product}'
customer_templates:
  en:
    GREET: Hello.
    CONFIRM: Yes.
    REJECT: No.
    PRICE_Q: How much is this {product}?
    AVAIL_Q: Do you have {product}?
    REQUEST: I want {quantity} {container} {product}.
    PAYMENT: I want to pay by {method}.
    DEFAULT: '{product}'
  hi:
    GREET: नमस्ते।
    CONFIRM: हाँ।
    REJECT: नहीं।
    PRICE_Q: इस {product} का दाम क्या है?
    AVAIL_Q: क्या आपके पास {product} है?
    REQUEST: मुझे {quantity} {container} {product} चाहिए।
    PAYMENT: मैं {method} से भुगतान करना चाहता हूँ।
    DEFAULT: '{product}'
  ta:
    GREET: வணக்கம்.
    CONFIRM: ஆம்.
    REJECT: இல்லை.
    PRICE_Q: இந்த {product} விலை என்ன?
    AVAIL_Q: உங்களிடம் {product} இருக்கிறதா?
    REQUEST: எனக்கு {quantity} {container} {product} வேண்டும்.
    PAYMENT: '{method} மூலம் பணம் செலுத்த விரும்புகிறேன்.'
    DEFAULT: '{product}'
  bn:
    GREET: নমস্কার।
    CONFIRM: হ্যাঁ।
    REJECT: না।
    PRICE_Q: এই {product} কত দাম?
    AVAIL_Q: আপনার কাছে {product} আছে?
    REQUEST: আমি {quantity} {container} {product} চাই।
    PAYMENT: আমি {method} দিয়ে পেমেন্ট করতে চাই।
    DEFAULT: '{product}'
  te:
    GREET: నమస్కారం.
    CONFIRM: అవును.
    REJECT: కాదు.
    PRICE_Q: ఈ {product} ధర ఎంత?
    AVAIL_Q: మీ దగ్గర {product} ఉందా?
    REQUEST: నాకు {quantity} {container} {product} కావాలి.
    PAYMENT: నేను {method} ద్వారా చెల్లించాలనుకుంటున్నాను.
    DEFAULT: '{product}'
